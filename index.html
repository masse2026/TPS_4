    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    /* Linea colorata decorativa in cima al riquadro */
    .project-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #58a6ff, #bc8cff);
    }

    .project-card:hover {
      transform: translateY(-2px);
      border-color: #444c56;
    }

    .card-title {
      color: #f0f6fc;
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title::before {
      content: "💻";
      font-size: 1.2rem;
    }

    .project-card p {
      color: var(--text-main);
      line-height: 1.6;
      font-size: 1.05rem;
      margin: 0;
