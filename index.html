<!DOCTYPE html>
<html lang="it-IT">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>TPS_4 | Lavori Web Development</title>

    <!-- Stile personalizzato stile GitHub Dark -->
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .custom-container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .main-header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 40px;
            text-align: center;
        }

        .main-header h1 {
            margin: 0;
        }

        .main-header h1 a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 800;
            letter-spacing: 1px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .section-title {
            color: #f0f6fc;
            font-size: 1.6rem;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        /* Griglia dei Progetti */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Riquadro Elegante (Card) */
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .project-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #58a6ff, #bc8cff);
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: #58a6ff;
            box-shadow: 0 12px 30px rgba(88, 166, 255, 0.15);
        }

        .card-title {
            color: #f0f6fc;
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title::before {
            content: "💻";
            font-size: 1.1rem;
        }

        .project-card p {
            color: var(--text-muted);
            line-height: 1.5;
            font-size: 0.95rem;
            margin: 0 0 15px 0;
        }

        .card-link {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="custom-container">
        <header class="main-header">
            <h1><a href="#">TPS_4</a></h1>
            <div class="subtitle">Laboratorio di Web Development • Corso TPSIT Anno 3</div>
        </header>

        <main>
            <h2 class="section-title">I Miei Esercizi Online</h2>
            
            <div class="projects-grid">
                
                <!-- CARD 1: COLLEGATA AD ANAGRAFICA.HTML -->
                <a href="anagrafica.html" class="project-card">
                    <div>
                        <h3 class="card-title">Gestione Anagrafica</h3>
                        <p>Tabella dinamica in JavaScript per l'inserimento e il salvataggio dei dati anagrafici (Nome, Cognome, Città, Età).</p>
                    </div>
                    <span class="card-link">Apri esercizio →</span>
                </a>

                <!-- DA QUI IN POI PUOI AGGIUNGERE I NUOVI LAVORI -->
                <!-- Quando crei un nuovo file (es. form.html), ti basta copiare il blocco qui sotto, cambiare l'href e i testi -->
                
                <!-- Esempio futuro esercizio (Scommentalo togliendo i commenti quando ti servirà)
                <a href="nome-del-tuo-prossimo-file.html" class="project-card">
                    <div>
                        <h3 class="card-title">Nuovo Esercizio</h3>
                        <p>Descrizione breve di quello che fa il nuovo programma svolto in classe.</p>
                    </div>
                    <span class="card-link">Apri esercizio →</span>
                </a>
                -->

            </div>
        </main>
    </div>

</body>
</html>
