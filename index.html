<div class="projects-grid" id="lista-progetti">
  <!-- I progetti verranno generati automaticamente da JavaScript -->
</div>

<script>
  // Inserisci qui l'elenco dei nomi dei tuoi file degli esercizi
  const fileEsercizi = [
    "esercizio_01_bottoni.html",
    "calcolatrice-js.html",
    "form_registrazione.html"
  ];

  const grid = document.getElementById('lista-progetti');

  fileEsercizi.forEach(file => {
    // Sostituisce estensione, underscore e trattini per il titolo
    let titolo = file.replace('.html', '').replace(/_/g, ' ').replace(/-/g, ' ');
    
    // Crea la card HTML
    const card = document.createElement('a');
    card.href = file;
    card.className = 'project-card';
    card.innerHTML = `
      <div>
        <h3 class="card-title">💻 ${titolo}</h3>
        <p>Applicazione web salvata nel repository del corso. Clicca sotto per avviarla ed eseguirla direttamente sul browser.</p>
      </div>
      <span class="card-link">Apri lavoro →</span>
    `;
    grid.appendChild(card);
  });
</script>
