<!DOCTYPE html>
<html lang="it-IT">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TPS_4 | Lavori Web Development</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
        }
        .custom-container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .main-header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 40px;
            text-align: center;
        }
        .main-header h1 { margin: 0; }
        .main-header h1 a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 800;
            font-size: 2.5rem;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 10px;
        }
        .section-title {
            color: #f0f6fc;
            font-size: 1.6rem;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .project-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #58a6ff, #bc8cff);
        }
        .project-card:hover {
            transform: translateY(-4px);
            border-color: #58a6ff;
        }
        .card-title {
            color: #f0f6fc;
            font-size: 1.3rem;
            margin: 0 0 12px 0;
            text-transform: capitalize;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .project-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0 0 15px 0;
            line-height: 1.5;
        }
        .card-link {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="custom-container">
        <header class="main-header">
            <h1><a href="#">TPS_4</a></h1>
            <div class="subtitle">Laboratorio di Web Development • Corso TPSIT Anno 3</div>
        </header>

        <main>
            <h2 class="section-title">I Miei Esercizi Online</h2>
            <!-- Griglia vuota che si riempie da sola tramite lo script -->
            <div class="projects-grid" id="lista-progetti"></div>
        </main>
    </div>

    <script>
        // Configurazione account GitHub basata sul tuo repository reale
        const username = 'masse2026'; 
        const repo = 'TPS_4'; 

        async function caricaEsercizi() {
            const container = document.getElementById('lista-progetti');
            try {
                // Chiamata alle API di GitHub per leggere i file del repository
                const response = await fetch(`https://github.com{username}/${repo}/contents`);
                const files = await response.json();

                // Ripulisce il contenitore prima di inserire i dati
                container.innerHTML = '';

                files.forEach(file => {
                    // Filtra solo i file con estensione .html ignorando la home
                    if (file.name.endsWith('.html') && file.name.toLowerCase() !== 'index.html' && file.name.toLowerCase() !== 'index.html') {
                        
                        // Rende il titolo più carino togliendo l'estensione del file
                        const titoloPulito = file.name.replace('.html', '').replace('_', ' ').replace('-', ' ');
                        
                        const card = document.createElement('a');
                        card.href = file.name;
                        card.className = 'project-card';
                        card.innerHTML = `
                            <div>
                                <h3 class="card-title">💻 ${titoloPulito}</h3>
                                <p>Applicazione web caricata nel repository del corso. Clicca sotto per avviarla ed eseguirla nel browser.</p>
                            </div>
                            <span class="card-link">Apri lavoro →</span>
                        `;
                        container.appendChild(card);
                    }
                });

                // Se non ci sono altri file oltre a index.html mostra un avviso pulito
                if (container.children.length === 0) {
                    container.innerHTML = "<p style='color: var(--text-muted);'>Nessun file di esercizio trovato oltre alla home.</p>";
                }

            } catch (error) {
                container.innerHTML = "<p style='color: #ff6b6b;'>Errore nel caricamento dei file da GitHub. Riprova più tardi.</p>";
            }
        }

        // Avvia la funzione al caricamento della pagina
        caricaEsercizi();
    </script>
</body>
</html>
