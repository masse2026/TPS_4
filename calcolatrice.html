<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolatrice a Caselle</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding-top: 50px;
        }
        .calcolatrice {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        input {
            width: 80px;
            padding: 8px;
            font-size: 16px;
            margin: 5px;
            text-align: center;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="calcolatrice">
        <h2>La mia Calcolatrice</h2>

        <!-- Prima casella per il primo numero -->
        <input type="number" id="num1" placeholder="Num 1">

        <!-- Seconda casella per il secondo numero -->
        <input type="number" id="num2" placeholder="Num 2">

        <br><br>

        <!-- I bottoni per fare le operazioni -->
        <button onclick="calcola('+')">+</button>
        <button onclick="calcola('-')">-</button>
        <button onclick="calcola('*')">×</button>
        <button onclick="calcola('/')">÷</button>

        <br><br>
        
        <h3 id="risultato">Risultato: 0</h3>
    </div>

    <script>
        function calcola(operazione) {
            var n1 = Number(document.getElementById("num1").value);
            var n2 = Number(document.getElementById("num2").value);
            
            var finale = 0;

            if (operazione == '+') {
                finale = n1 + n2;
            }
            if (operazione == '-') {
                finale = n1 - n2;
            }
            if (operazione == '*') {
                finale = n1 * n2;
            }
            if (operazione == '/') {
                if (n2 == 0) {
                    finale = "Errore (diviso 0)";
                } else {
                    finale = n1 / n2;
                }
            }
            document.getElementById("risultato").innerText = "Risultato: " + finale;
        }
    </script>

</body>
</html>
