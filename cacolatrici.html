<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>La Mia Prima Calcolatrice</title>
    <style>
        /* Uno stile semplice, scuro e ordinato per i bottoni */
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .contenitore {
            background-color: #2d2d2d;
            width: 250px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 10px;
        }
        #schermo {
            width: 100%;
            height: 40px;
            font-size: 20px;
            text-align: right;
            margin-bottom: 20px;
            padding: 5px;
            box-sizing: border-box;
        }
        .riga {
            margin-bottom: 10px;
        }
        button {
            width: 45px;
            height: 45px;
            font-size: 18px;
            cursor: pointer;
        }
        .pulsante-cancella {
            width: 100px;
            background-color: #ff4d4d;
            color: white;
        }
        .pulsante-uguale {
            background-color: #4caf50;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Link per tornare alla pagina principale di GitHub Pages -->
    <p><a href="index.html" style="color: #58a6ff;">← Torna alla Home</a></p>

    <div class="contenitore">
        <h2>Calcolatrice</h2>
        
        <!-- Lo schermo dove si vedono i numeri -->
        <input type="text" id="schermo" value="" readonly>

        <!-- Riga 1: I bottoni di controllo -->
        <div class="riga">
            <button class="pulsante-cancella" onclick="cancella()">C</button>
            <button onclick="aggiungi('/')">/</button>
            <button onclick="aggiungi('*')">×</button>
        </div>

        <!-- Riga 2: Numeri 7, 8, 9 e il Meno -->
        <div class="riga">
            <button onclick="aggiungi('7')">7</button>
            <button onclick="aggiungi('8')">8</button>
            <button onclick="aggiungi('9')">9</button>
            <button onclick="aggiungi('-')">-</button>
        </div>

        <!-- Riga 3: Numeri 4, 5, 6 e il Più -->
        <div class="riga">
            <button onclick="aggiungi('4')">4</button>
            <button onclick="aggiungi('5')">5</button>
            <button onclick="aggiungi('6')">6</button>
            <button onclick="aggiungi('+')">+</button>
        </div>

        <!-- Riga 4: Numeri 1, 2, 3 e il tasto Uguale -->
        <div class="riga">
            <button onclick="aggiungi('1')">1</button>
            <button onclick="aggiungi('2')">2</button>
            <button onclick="aggiungi('3')">3</button>
            <button class="pulsante-uguale" onclick="calcola()">=</button>
        </div>

        <!-- Riga 5: Lo Zero e il Punto decimale -->
        <div class="riga">
            <button onclick="aggiungi('0')" style="width: 100px;">0</button>
            <button onclick="aggiungi('.')">,</button>
        </div>
    </div>

    <script>
        // Questa variabile prende lo schermo HTML per poterlo modificare
        var schermo = document.getElementById('schermo');

        // Funzione 1: Aggiunge il numero o il segno cliccato sullo schermo
        function aggiungi(valore) {
            schermo.value = schermo.value + valore;
        }

        // Funzione 2: Svuota completamente lo schermo (tasto C)
        function cancella() {
            schermo.value = '';
        }

        // Funzione 3: Fa il calcolo matematico usando la funzione base "eval"
        function calcola() {
            try {
                // eval prende la scritta sullo schermo (es. "5+3") e fa il calcolo automatico
                schermo.value = eval(schermo.value);
            } catch (errore) {
                // Se scrivi qualcosa di matematicamente sbagliato (es. "5++2"), esce la scritta Errore
                schermo.value = 'Errore';
            }
        }
    </script>

</body>
</html>
