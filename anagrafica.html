<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabella Anagrafica 1.0</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h2 {
            font-size: 1.6rem;
            margin-bottom: 24px;
            color: #f0f6fc;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            background-color: #0d1117;
            color: var(--text-main);
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
            background-color: #161b22;
        }

        button {
            grid-column: span 2;
            background-color: var(--accent-color);
            color: #0d1117;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #79c0ff;
        }

        button:active {
            transform: scale(0.98);
        }

        .table-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #1f242c;
            color: #f0f6fc;
            padding: 16px 20px;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 0.95rem;
            background-color: var(--card-bg);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #1f242c;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">&larr; Torna alla Home</a>
       
        <h2>Gestione Anagrafica</h2>

        <div class="form-container">
            <div class="form-group">
                <label for="nomino">Nome</label>
                <input type="text" id="nomino" class="tdati" placeholder="es. Mario">
            </div>
            <div class="form-group">
                <label for="cognomimo">Cognome</label>
                <input type="text" id="cognomimo" class="tdati" placeholder="es. Rossi">
            </div>
            <div class="form-group full-width">
                <label for="indirizzino">Indirizzo</label>
                <input type="text" id="indirizzino" class="tdati" placeholder="es. Via Roma 10">
            </div>
            <div class="form-group">
                <label for="cittino">Città</label>
                <input type="text" id="cittino" class="tdati" placeholder="es. Milano">
            </div>
            <div class="form-group">
                <label for="etino">Età</label>
                <input type="number" id="etino" class="tdati" placeholder="es. 25">
            </div>
            <button type="button" onclick="aggiungiRiga()">Aggiungi alla Tabella</button>
        </div>

        <h2>Elenco Registrati</h2>
        <div class="table-container">
            <table id="tabellaAnagrafica">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cognome</th>
                        <th>Indirizzo</th>
                        <th>Città</th>
                        <th>Età</th>
                    </tr>
                </thead>
                <tbody id="dati">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function aggiungiRiga() {
            const nome = document.getElementById('nomino').value;
            const cognome = document.getElementById('cognomimo').value;
            const indirizzo = document.getElementById('indirizzino').value;
            const citta = document.getElementById('cittino').value;
            const eta = document.getElementById('etino').value;

            if (!nome || !cognome || !indirizzo || !citta || !eta) {
                alert("Compila tutti i campi prima di aggiungere la riga.");
                return;
            }

            document.getElementById('dati').innerHTML +=
                '<tr>' +
                    '<td>' + nome + '</td>' +
                    '<td>' + cognome + '</td>' +
                    '<td>' + indirizzo + '</td>' +
                    '<td>' + citta + '</td>' +
                    '<td>' + eta + '</td>' +
                '</tr>';
        }
    </script>

</body>
</html>
